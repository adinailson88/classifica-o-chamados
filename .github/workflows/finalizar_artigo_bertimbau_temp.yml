name: Finalizar artigo com BERTimbau (temporario)

# Disparo controlado após a instalação do workflow na main.
on:
  push:
    branches: [main]
    paths:
      - src/atualizar_artigo_bertimbau_temp.py
      - .github/workflows/finalizar_artigo_bertimbau_temp.yml

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH_FINAL: docs/artigo-bertimbau-final-20260728
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Criar branch exclusiva do artigo
        run: git checkout -B "$BRANCH_FINAL"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-estatistica.txt

      - name: Instalar dependencias de validacao
        run: |
          python -m pip install --retries 5 --timeout 120 -r requirements-estatistica.txt
          python -m pip install --retries 5 --timeout 120 matplotlib

      - name: Atualizar o artigo por secoes
        run: python src/atualizar_artigo_bertimbau_temp.py

      - name: Normalizar marcadores de secao
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('04_artigo/artigo_classificacao_chamados_v3.md')
          t = p.read_text(encoding='utf-8')
          ajustes = {
              '**4.1 Concordância\n\n**4.1 Concordância': '**4.1 Concordância',
              '**4.3 A classificação automática\n\n**4.3 A classificação automática': '**4.3 A classificação automática',
              '**4.4 Confiança\n\n**4.4 Confiança': '**4.4 Confiança',
              '**3.7 Memória de decisão\n\n**3.7 Memória de decisão': '**3.7 Memória de decisão',
              '**5.2 Reclassificação\n\n**5.2 Reclassificação': '**5.2 Reclassificação',
              '**5.4 Contribuição\n\n**5.4 Contribuição': '**5.4 Contribuição',
              '**REFERÊNCIAS**\n\n**REFERÊNCIAS**': '**REFERÊNCIAS**',
          }
          for antigo, novo in ajustes.items():
              t = t.replace(antigo, novo)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar texto, secoes e fontes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('04_artigo/artigo_classificacao_chamados_v3.md')
          t = p.read_text(encoding='utf-8')
          obrigatorios = {
              '**4.3 BERTimbau no holdout comum de oito modelos**': 1,
              '**Tabela 3** Comparação dos oito modelos': 1,
              'BERTimbau | 0,6520 | 0,7746': 1,
              '*p* = 0,510': 3,
              '8.895': 6,
              '639': 10,
              'SOUZA, F.; NOGUEIRA, R.; LOTUFO, R.': 1,
              'DEVLIN, J.; CHANG, M.-W.; LEE, K.; TOUTANOVA, K.': 1,
          }
          for trecho, minimo in obrigatorios.items():
              n = t.count(trecho)
              assert n >= minimo, (trecho, n, minimo)

          proibidos = [
              '17.790', '1,83%', '8.928', '95,24%', '0,9524',
              '0,8858', '88,58%', 'treino não foi concluído',
              'neither completed training', 'remains a planned extension',
              '606 casos restritos', '606 restritos',
              'classificação automática correta** | 16.510',
          ]
          encontrados = [x for x in proibidos if x in t]
          assert not encontrados, encontrados

          headings = [
              '**4.1 Concordância com o histórico (base completa)**',
              '**4.2 Ranking validado por conferência humana**',
              '**4.3 BERTimbau no holdout comum de oito modelos**',
              '**4.4 Confiança, calibração e faixas de decisão**',
              '**5.1 Concordância histórica, acerto validado e BERTimbau**',
              '**5.2 Reclassificação, ambiguidade taxonômica e calibração**',
              '**5.3 Limitações**',
              '**5.4 Contribuição para a governança preditiva da manutenção**',
          ]
          for h in headings:
              assert t.count(h) == 1, (h, t.count(h))
          print('texto final validado')
          PY

      - name: Compilar e testar o repositorio
        run: |
          python -m py_compile src/atualizar_artigo_bertimbau_temp.py
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          git diff --check

      - name: Gerar PDF com pandoc e xelatex
        uses: docker://pandoc/extra:latest
        env:
          TEXINPUTS: ".:./04_artigo/latex:"
        with:
          args: >-
            04_artigo/artigo_classificacao_chamados_v3.md
            -o docs/artigo_classificacao_chamados.pdf
            --pdf-engine=xelatex
            -V lang=pt-BR
            -V geometry:margin=2.5cm
            --standalone

      - name: Renderizar e validar o PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p artefatos_pdf/render
          pdfinfo docs/artigo_classificacao_chamados.pdf > artefatos_pdf/pdfinfo.txt
          pdftotext docs/artigo_classificacao_chamados.pdf artefatos_pdf/artigo.txt
          grep -q 'BERTimbau no holdout comum' artefatos_pdf/artigo.txt
          grep -q '77,46%' artefatos_pdf/artigo.txt
          ! grep -q '17.790' artefatos_pdf/artigo.txt
          ! grep -q '8.928' artefatos_pdf/artigo.txt
          pdftoppm -png -r 110 docs/artigo_classificacao_chamados.pdf artefatos_pdf/render/pagina >/dev/null 2>&1
          PAGINAS=$(pdfinfo docs/artigo_classificacao_chamados.pdf | awk '/^Pages:/ {print $2}')
          TAMANHO=$(stat -c%s docs/artigo_classificacao_chamados.pdf)
          test "$PAGINAS" -ge 10
          test "$PAGINAS" -le 40
          test "$TAMANHO" -gt 100000
          printf 'paginas=%s\ntamanho_bytes=%s\n' "$PAGINAS" "$TAMANHO" > artefatos_pdf/validacao.txt
          cat artefatos_pdf/validacao.txt

      - name: Publicar PDF e renderizacoes para revisao
        uses: actions/upload-artifact@v4
        with:
          name: artigo-bertimbau-final
          path: |
            docs/artigo_classificacao_chamados.pdf
            artefatos_pdf/pdfinfo.txt
            artefatos_pdf/validacao.txt
            artefatos_pdf/render/*.png
          if-no-files-found: error

      - name: Registrar estado e remover orquestracao temporaria
        run: |
          mkdir -p dados
          PAGINAS=$(pdfinfo docs/artigo_classificacao_chamados.pdf | awk '/^Pages:/ {print $2}')
          TAMANHO=$(stat -c%s docs/artigo_classificacao_chamados.pdf)
          python - <<PY
          import json
          from pathlib import Path
          Path('dados/finalizacao_artigo_bertimbau.json').write_text(
              json.dumps({
                  'status': 'concluido',
                  'branch': '${BRANCH_FINAL}',
                  'paginas_pdf': int('${PAGINAS}'),
                  'tamanho_pdf_bytes': int('${TAMANHO}'),
                  'workflow_run': '${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}',
                  'resultado_bertimbau': {
                      'holdout_total': 1000,
                      'holdout_validado': 639,
                      'acerto_validado': 0.7746,
                      'posicao': 2,
                      'p_mcnemar_vs_linear_svc': 0.5104099416812344
                  }
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY
          git rm src/atualizar_artigo_bertimbau_temp.py
          git rm .github/workflows/finalizar_artigo_bertimbau_temp.yml

      - name: Commitar resultado na branch final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 04_artigo/artigo_classificacao_chamados_v3.md \
            docs/artigo_classificacao_chamados.pdf \
            dados/finalizacao_artigo_bertimbau.json
          git diff --cached --quiet && { echo "sem alteracoes"; exit 1; }
          git commit -m "docs: finaliza artigo com avaliacao do BERTimbau [skip ci]"
          git push --force-with-lease origin HEAD:"$BRANCH_FINAL"
