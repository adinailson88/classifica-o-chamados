name: Diagnóstico temporário do layout do artigo

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnosticar:
    if: github.event.pull_request.title == 'Diagnosticar paginação do artigo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 100
      - name: Instalar renderizador
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Comparar PDF atual com a versão anterior ao apêndice
        run: |
          mkdir -p diagnostico/atual diagnostico/anterior
          cp docs/artigo_classificacao_chamados.pdf diagnostico/atual/artigo.pdf
          git show 3823a4d208340be43c9348ced0451d8b4ce1e245:docs/artigo_classificacao_chamados.pdf > diagnostico/anterior/artigo.pdf
          pdfinfo diagnostico/atual/artigo.pdf > diagnostico/atual/pdfinfo.txt
          pdfinfo diagnostico/anterior/artigo.pdf > diagnostico/anterior/pdfinfo.txt
          pdftotext -f 10 -l 15 -layout diagnostico/atual/artigo.pdf diagnostico/atual/paginas_10_15.txt
          pdftotext -f 10 -l 15 -layout diagnostico/anterior/artigo.pdf diagnostico/anterior/paginas_10_15.txt
          pdftoppm -f 10 -l 15 -png -r 160 diagnostico/atual/artigo.pdf diagnostico/atual/pagina
          pdftoppm -f 10 -l 15 -png -r 160 diagnostico/anterior/artigo.pdf diagnostico/anterior/pagina
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-layout-artigo
          path: diagnostico
