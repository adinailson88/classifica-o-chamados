name: Migracao categoria equipamentos e acessorios

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar a migracao quando o cenario permitir"
        default: "false"
        required: true
      forcar:
        description: "Forcar aplicacao mesmo fora dos cenarios seguros"
        default: "false"
        required: true
      atualizar_dados_antes:
        description: "Tentar atualizar dados/artefatos antes do diagnostico"
        default: "true"
        required: true
      commitar:
        description: "Commitar alteracoes geradas pela migracao"
        default: "false"
        required: true
      validar_por_texto_quando_sem_id:
        description: "Permitir validacao textual quando nao houver ID de categoria"
        default: "true"
        required: true

permissions:
  contents: write

concurrency:
  group: migracao-categoria-equipamentos-acessorios
  cancel-in-progress: false

jobs:
  migracao:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt

      - name: Instalar dependencias minimas
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-leves.txt ]; then
            python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
          fi
          if [ -d tests ]; then
            python -m pip install --retries 5 --timeout 120 pytest
          fi

      - name: Diagnostico do repositorio
        run: |
          git branch --show-current
          git rev-parse HEAD
          git status --short --branch
          find .github/workflows src scripts docs dados dados_csv -maxdepth 2 -type f 2>/dev/null | sort || true

      - name: Atualizar dados antes, se possivel
        if: ${{ github.event.inputs.atualizar_dados_antes == 'true' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "Secret GCP_SA_KEY ausente; seguindo apenas com diagnostico dos arquivos existentes."
            printf '\n\n## Atualizacao previa de dados\n\nSecret GCP_SA_KEY ausente; dados nao foram atualizados antes da migracao.\n' > "$RUNNER_TEMP/migracao_categoria_atualizacao_previa.md"
            exit 0
          fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
          set +e
          python src/exportar_dashboard.py
          STATUS_DASH=$?
          python src/analise_shannon.py
          STATUS_SHANNON=$?
          python src/relevancia_termos.py --top-n 25 --min-df 5 --min-chamados-categoria 10
          STATUS_TERMOS=$?
          python src/cruzamento_taxonomia.py --min-df 5 --min-chamados-categoria 10
          STATUS_CRUZAMENTO=$?
          rm -f credenciais_sa.json
          set -e
          {
            echo ""
            echo "## Atualizacao previa de dados"
            echo ""
            echo "- exportar_dashboard.py: $STATUS_DASH"
            echo "- analise_shannon.py: $STATUS_SHANNON"
            echo "- relevancia_termos.py: $STATUS_TERMOS"
            echo "- cruzamento_taxonomia.py: $STATUS_CRUZAMENTO"
          } > "$RUNNER_TEMP/migracao_categoria_atualizacao_previa.md"

      - name: Rodar migracao em dry-run
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.validar_por_texto_quando_sem_id }}" = "true" ]; then
            EXTRA="$EXTRA --validar-por-texto-quando-sem-id"
          fi
          python scripts/migracoes/migrar_categoria_equipamentos_acessorios.py \
            --relatorio docs/RELATORIO_MIGRACAO_CATEGORIA_EQUIPAMENTOS_ACESSORIOS.md \
            $EXTRA

      - name: Aplicar migracao, se solicitado
        if: ${{ github.event.inputs.aplicar == 'true' }}
        run: |
          EXTRA="--aplicar"
          if [ "${{ github.event.inputs.forcar }}" = "true" ]; then
            EXTRA="$EXTRA --forcar"
          fi
          if [ "${{ github.event.inputs.validar_por_texto_quando_sem_id }}" = "true" ]; then
            EXTRA="$EXTRA --validar-por-texto-quando-sem-id"
          fi
          python scripts/migracoes/migrar_categoria_equipamentos_acessorios.py \
            --relatorio docs/RELATORIO_MIGRACAO_CATEGORIA_EQUIPAMENTOS_ACESSORIOS.md \
            $EXTRA

      - name: Registrar atualizacao previa no relatorio
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/migracao_categoria_atualizacao_previa.md" ] && [ -f docs/RELATORIO_MIGRACAO_CATEGORIA_EQUIPAMENTOS_ACESSORIOS.md ]; then
            cat "$RUNNER_TEMP/migracao_categoria_atualizacao_previa.md" >> docs/RELATORIO_MIGRACAO_CATEGORIA_EQUIPAMENTOS_ACESSORIOS.md
          fi

      - name: Validar JSONs
        run: |
          python - <<'PY'
          import glob, json
          for path in glob.glob("**/*.json", recursive=True):
              if path.startswith(".git/"):
                  continue
              with open(path, encoding="utf-8") as f:
                  json.load(f)
          print("JSONs validos")
          PY

      - name: Compilar Python
        run: python -m compileall .

      - name: Rodar pytest, se houver testes
        run: |
          if [ -d tests ]; then
            python -m pytest
          else
            echo "sem testes automatizados detectados" >> docs/RELATORIO_MIGRACAO_CATEGORIA_EQUIPAMENTOS_ACESSORIOS.md
          fi

      - name: Diff e status
        run: |
          git diff --stat
          git status --short --branch

      - name: Commit opcional
        if: ${{ github.event.inputs.commitar == 'true' }}
        run: |
          if git diff --quiet; then
            echo "sem alteracoes para commitar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/migracao_categoria_equipamentos_acessorios.yml \
            scripts/migracoes/migrar_categoria_equipamentos_acessorios.py \
            docs/MIGRACAO_CATEGORIA_EQUIPAMENTOS_ACESSORIOS.md \
            docs/RELATORIO_MIGRACAO_CATEGORIA_EQUIPAMENTOS_ACESSORIOS.md \
            docs/dados \
            dados \
            analise_R || true
          git diff --cached --quiet && { echo "sem alteracoes versionaveis"; exit 0; }
          git commit -m "normaliza renomeacao de categoria de equipamentos e acessorios"
          echo "Commit criado localmente no workflow. Push nao executado automaticamente."
