name: Retreinar modelos canonicos (read-only)

on:
  workflow_dispatch:
    inputs:
      modelos:
        description: "Modelos separados por virgula"
        required: false
        default: "naive_bayes,regressao_logistica,linear_svc,sgd,extra_trees,random_forest,lstm"

permissions:
  contents: read

jobs:
  retreinar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 300 -r requirements.txt
      - name: Testes do retreino
        run: |
          python -m unittest discover -s tests -p "test_retreinar_modelos_canonicos.py" -t tests
          python -m unittest discover -s tests -p "test_modelos_zoo_margem.py" -t tests
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Retreinar sem escrever na planilha
        id: retreino
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: python src/retreinar_modelos_canonicos.py --modelos "${{ inputs.modelos }}"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Publicar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retreino-canonico
          path: |
            docs/dados/retreino_canonico.json
            docs/dados/retreino_canonico_predicoes.csv
            docs/RETREINO_CANONICO.md
          if-no-files-found: error
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.retreino.outcome == 'failure'
        run: |
          echo "Retreino concluiu com bloqueios; consulte o artefato." >&2
          exit 1
