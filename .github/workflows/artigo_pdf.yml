name: Gerar PDF do artigo

# Converte 04_artigo/artigo_classificacao_chamados_v3.md em PDF via pandoc/xelatex.
# Em main, publica em docs/. Em pull request, disponibiliza o PDF como artefato.

on:
  push:
    branches: [main]
    paths:
      - "04_artigo/artigo_classificacao_chamados_v3.md"
      - ".github/workflows/artigo_pdf.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: gerar-pdf-artigo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gerar-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Gerar PDF (pandoc + xelatex)
        uses: docker://pandoc/extra:latest
        with:
          args: >-
            04_artigo/artigo_classificacao_chamados_v3.md
            -o docs/artigo_classificacao_chamados.pdf
            --pdf-engine=xelatex
            -V lang=pt-BR
            -V geometry:margin=2.5cm
            --standalone

      - name: Publicar PDF para revisao da PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: artigo-classificacao-pr-${{ github.event.pull_request.number }}
          path: docs/artigo_classificacao_chamados.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Commitar PDF gerado em main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/artigo_classificacao_chamados.pdf
          if git diff --cached --quiet; then
            echo "PDF sem mudancas, nada a commitar."
          else
            git commit -m "pdf do artigo gerado automaticamente [skip ci]"
            git push
          fi
