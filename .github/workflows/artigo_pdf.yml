name: Gerar PDF do artigo

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  gerar-pdf:
    if: github.event.pull_request.title == 'Aplicar terminologia conceitual no artigo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter branch do Pull Request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 50

      - name: Verificar se a alteração ainda precisa ser executada
        id: verificar
        shell: bash
        run: |
          if test -f src/temporario_ajustar_termos_artigo.py; then
            echo "executar=true" >> "$GITHUB_OUTPUT"
          else
            echo "executar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Substituir identificadores internos por decisões conceituais
        if: steps.verificar.outputs.executar == 'true'
        run: python src/temporario_ajustar_termos_artigo.py

      - name: Verificar termos removidos
        if: steps.verificar.outputs.executar == 'true'
        shell: bash
        run: |
          if grep -nE 'M/N/P/Q|categoria manual Q' 04_artigo/artigo_classificacao_chamados_v3.md; then
            echo "Ainda existem identificadores internos no artigo."
            exit 1
          fi

      - name: Gerar PDF (pandoc + xelatex)
        if: steps.verificar.outputs.executar == 'true'
        uses: docker://pandoc/extra:latest
        env:
          TEXINPUTS: ".:./04_artigo/latex:"
        with:
          args: >-
            04_artigo/artigo_classificacao_chamados_v3.md
            -o docs/artigo_classificacao_chamados.pdf
            --pdf-engine=xelatex
            -V lang=pt-BR
            -V geometry:margin=2.5cm
            --standalone

      - name: Commitar artigo e PDF gerado
        if: steps.verificar.outputs.executar == 'true'
        shell: bash
        run: |
          test -s docs/artigo_classificacao_chamados.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git show 8d910d78d1d241fbdf15db750d6274ba05f6c85a:.github/workflows/artigo_pdf.yml > .github/workflows/artigo_pdf.yml
          rm src/temporario_ajustar_termos_artigo.py
          git add 04_artigo/artigo_classificacao_chamados_v3.md \
                  docs/artigo_classificacao_chamados.pdf \
                  PLANO_ARTIGO_CAPITULO.md \
                  .github/workflows/artigo_pdf.yml \
                  src/temporario_ajustar_termos_artigo.py
          git commit -m "substituir códigos de colunas por decisões conceituais"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
