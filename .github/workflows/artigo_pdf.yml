name: Gerar PDF do artigo

# Converte 04_artigo/artigo_classificacao_chamados_v3.md em PDF via pandoc/xelatex.
# O gatilho da branch agent e o artefato sao temporarios para revisar a PR 75.

on:
  push:
    branches:
      - main
      - agent/corrigir-sincronizacao-artigo
    paths:
      - "04_artigo/artigo_classificacao_chamados_v3.md"
      - ".github/workflows/artigo_pdf.yml"
  workflow_dispatch:

concurrency:
  group: gerar-pdf-artigo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gerar-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Gerar PDF (pandoc + xelatex)
        uses: docker://pandoc/extra:latest
        with:
          args: >-
            04_artigo/artigo_classificacao_chamados_v3.md
            -o docs/artigo_classificacao_chamados.pdf
            --pdf-engine=xelatex
            -V lang=pt-BR
            -V geometry:margin=2.5cm
            --standalone

      - name: Publicar PDF como artefato temporario
        uses: actions/upload-artifact@v4
        with:
          name: artigo-classificacao-pr75
          path: docs/artigo_classificacao_chamados.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Registrar execucao e commitar PDF
        run: |
          mkdir -p docs/diagnosticos
          printf '%s\n' "${{ github.run_id }}" > docs/diagnosticos/pdf_pr75_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/artigo_classificacao_chamados.pdf docs/diagnosticos/pdf_pr75_run_id.txt
          if git diff --cached --quiet; then
            echo "PDF e run_id sem mudancas."
          else
            git commit -m "pdf do artigo gerado automaticamente [skip ci]"
            git push
          fi
