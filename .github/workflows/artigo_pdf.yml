name: Gerar PDF do artigo

# Converte 04_artigo/artigo_classificacao_chamados_v3.md em PDF via pandoc/xelatex
# e publica em docs/. O gatilho da branch agent e temporario para revisar a PR 75.

on:
  push:
    branches:
      - main
      - agent/corrigir-sincronizacao-artigo
    paths:
      - "04_artigo/artigo_classificacao_chamados_v3.md"
      - ".github/workflows/artigo_pdf.yml"
  workflow_dispatch:

concurrency:
  group: gerar-pdf-artigo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gerar-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Gerar PDF (pandoc + xelatex)
        uses: docker://pandoc/extra:latest
        with:
          args: >-
            04_artigo/artigo_classificacao_chamados_v3.md
            -o docs/artigo_classificacao_chamados.pdf
            --pdf-engine=xelatex
            -V lang=pt-BR
            -V geometry:margin=2.5cm
            --standalone

      - name: Commitar PDF gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/artigo_classificacao_chamados.pdf
          if git diff --cached --quiet; then
            echo "PDF sem mudancas, nada a commitar."
          else
            git commit -m "pdf do artigo gerado automaticamente [skip ci]"
            git push
          fi
