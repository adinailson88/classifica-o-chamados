name: Gerar PDF do artigo

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  gerar-pdf:
    if: github.event.pull_request.title == 'Adicionar apêndice de categorias ao artigo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter branch do Pull Request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 50

      - name: Verificar se a alteração ainda precisa ser executada
        id: verificar
        shell: bash
        run: |
          if test -f src/temporario_adicionar_apendice_categorias.py; then
            echo "executar=true" >> "$GITHUB_OUTPUT"
          else
            echo "executar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inserir apêndice com a distribuição das categorias
        if: steps.verificar.outputs.executar == 'true'
        run: python src/temporario_adicionar_apendice_categorias.py

      - name: Verificar apêndice gerado
        if: steps.verificar.outputs.executar == 'true'
        shell: bash
        run: |
          test "$(grep -c 'APÊNDICE A — DISTRIBUIÇÃO DAS CATEGORIAS HISTÓRICAS DO CORPUS' 04_artigo/artigo_classificacao_chamados_v3.md)" -eq 1
          grep -F '| **Total** | **13.965** |' 04_artigo/artigo_classificacao_chamados_v3.md

      - name: Gerar PDF (pandoc + xelatex)
        if: steps.verificar.outputs.executar == 'true'
        uses: docker://pandoc/extra:latest
        env:
          TEXINPUTS: ".:./04_artigo/latex:"
        with:
          args: >-
            04_artigo/artigo_classificacao_chamados_v3.md
            -o docs/artigo_classificacao_chamados.pdf
            --pdf-engine=xelatex
            -V lang=pt-BR
            -V geometry:margin=2.5cm
            --standalone

      - name: Commitar artigo e PDF gerado
        if: steps.verificar.outputs.executar == 'true'
        shell: bash
        run: |
          test -s docs/artigo_classificacao_chamados.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git show a8ec78475de5239087a20fd7c3235925dd721a0f:.github/workflows/artigo_pdf.yml > .github/workflows/artigo_pdf.yml
          rm src/temporario_adicionar_apendice_categorias.py
          git add 04_artigo/artigo_classificacao_chamados_v3.md \
                  docs/artigo_classificacao_chamados.pdf \
                  .github/workflows/artigo_pdf.yml \
                  src/temporario_adicionar_apendice_categorias.py
          git commit -m "adicionar apêndice com distribuição das categorias"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
