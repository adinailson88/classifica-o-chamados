name: Pendencias artigo com credencial

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "tabela_s1, history, diagnostico_ablation, diagnostico_protocolo_ablation, diagnostico_materializacao_lstm, ablation, sensibilidade_vies, holdout_vs_kfold, kfold_vs_groupkfold, figuras_artigo ou congelar_alvo_ensemble"
        required: true
        default: "tabela_s1"
        type: choice
        options:
          - tabela_s1
          - history
          - diagnostico_ablation
          - diagnostico_protocolo_ablation
          - diagnostico_materializacao_lstm
          - ablation
          - sensibilidade_vies
          - holdout_vs_kfold
          - kfold_vs_groupkfold
          - figuras_artigo
          - congelar_alvo_ensemble
      epochs:
        description: "Epocas de treino"
        required: false
        default: "15"
      k_folds:
        description: "Folds para ablation"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  lstm-artigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install matplotlib tensorflow scikit-learn statsmodels

      - name: Preparar credencial da planilha
        if: ${{ github.event.inputs.tarefa != 'figuras_artigo' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_SA_KEY"
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json

      - name: Validar sintaxe e testes
        run: |
          python -m py_compile src/exportar_tabela_por_categoria.py src/modelo_lstm.py src/ablation_lstm.py src/limpar_classif_multimodelo.py src/analise_sensibilidade_vies_validacao.py src/comparacao_holdout_kfold.py src/comparacao_kfold_groupkfold.py src/congelar_alvo_ensemble.py
          python -m unittest discover -s tests

      - name: Exportar tabela S1 da aba viva
        if: ${{ github.event.inputs.tarefa == 'tabela_s1' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/exportar_tabela_por_categoria.py

      - name: Gerar history real do LSTM
        if: ${{ github.event.inputs.tarefa == 'history' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/modelo_lstm.py --epochs "${{ github.event.inputs.epochs }}"

      - name: Rodar ablation real do LSTM
        if: ${{ github.event.inputs.tarefa == 'ablation' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/ablation_lstm.py --epochs "${{ github.event.inputs.epochs }}" --k-folds "${{ github.event.inputs.k_folds }}"

      - name: Diagnosticar duplicatas entre folds do ablation
        if: ${{ github.event.inputs.tarefa == 'diagnostico_ablation' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/ablation_lstm.py --diagnostico-only --k-folds "${{ github.event.inputs.k_folds }}"

      - name: Diagnosticar protocolo residual do ablation
        if: ${{ github.event.inputs.tarefa == 'diagnostico_protocolo_ablation' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/ablation_lstm.py --diagnostico-protocolo-only --k-folds "${{ github.event.inputs.k_folds }}"

      - name: Diagnosticar materializacao oficial nova do LSTM
        if: ${{ github.event.inputs.tarefa == 'diagnostico_materializacao_lstm' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/ablation_lstm.py --diagnostico-materializacao-oficial-only

      - name: Quantificar vies estrutural da amostra validada
        if: ${{ github.event.inputs.tarefa == 'sensibilidade_vies' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/analise_sensibilidade_vies_validacao.py

      - name: Comparar holdout fixo (85/15) com a referencia k-fold
        if: ${{ github.event.inputs.tarefa == 'holdout_vs_kfold' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/comparacao_holdout_kfold.py

      - name: Comparar KFold por linha com GroupKFold por hash de texto
        if: ${{ github.event.inputs.tarefa == 'kfold_vs_groupkfold' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/comparacao_kfold_groupkfold.py --k-folds "${{ github.event.inputs.k_folds }}"

      # As seis figuras atuais do artigo usam somente as fontes cientificas
      # oficiais (Lote 7C/7D): Figura 1 e diagrama estatico; Figuras 2-5 vem
      # do gerador canonico, que confere hash_corpus contra a rodada
      # congelada e aborta se divergir; Figura 6 e o unico gerador do LSTM.
      # Os geradores legados (figura2/3/4/6/7 antigos) leem JSON operacional
      # vivo, nao verificam hash_corpus e escrevem por cima dos mesmos nomes
      # de arquivo -- ficam fora deste caminho.
      - name: Regerar as figuras oficiais do artigo (PDF vetorial + PNG 300 dpi)
        if: ${{ github.event.inputs.tarefa == 'figuras_artigo' }}
        run: |
          python src/gerar_figura1_pipeline.py
          python src/gerar_figuras_canonicas.py \
            --apenas custo confiabilidade categorias matriz
          python src/gerar_figura5_curva_aprendizado.py

      # So informativo: SHA-256 e diffstat nao sao usados como criterio de
      # aprovacao (a identidade byte-a-byte depende do ambiente de
      # renderizacao e do metadado de timestamp do backend PDF do
      # Matplotlib). O criterio cientifico e o hash_corpus conferido acima.
      - name: Relatorio de auditoria das figuras regeneradas
        if: ${{ github.event.inputs.tarefa == 'figuras_artigo' }}
        run: |
          sha256sum \
            04_artigo/figuras/fig_pipeline_governanca.pdf \
            04_artigo/figuras/fig_pipeline_governanca.png \
            04_artigo/figuras/fig_tradeoff_custo.pdf \
            04_artigo/figuras/fig_tradeoff_custo.png \
            04_artigo/figuras/fig_confianca_desfecho.pdf \
            04_artigo/figuras/fig_confianca_desfecho.png \
            04_artigo/figuras/fig_calor_categorias.pdf \
            04_artigo/figuras/fig_calor_categorias.png \
            04_artigo/figuras/fig_matriz_confusao.pdf \
            04_artigo/figuras/fig_matriz_confusao.png \
            04_artigo/figuras/fig_curva_aprendizado_lstm.pdf \
            04_artigo/figuras/fig_curva_aprendizado_lstm.png
          git diff --stat -- 04_artigo/figuras

      # Default-deny: a regeneracao das figuras e read-only em relacao ao
      # repositorio. Qualquer arquivo alterado ou nao rastreado fora dos 12
      # caminhos das seis figuras atuais falha o job antes do upload -- nao
      # ha git add/commit/push neste caminho.
      - name: Verificar allowlist das figuras regeneradas
        if: ${{ github.event.inputs.tarefa == 'figuras_artigo' }}
        run: |
          ALLOWLIST="$(mktemp)"
          cat > "$ALLOWLIST" <<'EOF'
          04_artigo/figuras/fig_pipeline_governanca.pdf
          04_artigo/figuras/fig_pipeline_governanca.png
          04_artigo/figuras/fig_tradeoff_custo.pdf
          04_artigo/figuras/fig_tradeoff_custo.png
          04_artigo/figuras/fig_confianca_desfecho.pdf
          04_artigo/figuras/fig_confianca_desfecho.png
          04_artigo/figuras/fig_calor_categorias.pdf
          04_artigo/figuras/fig_calor_categorias.png
          04_artigo/figuras/fig_matriz_confusao.pdf
          04_artigo/figuras/fig_matriz_confusao.png
          04_artigo/figuras/fig_curva_aprendizado_lstm.pdf
          04_artigo/figuras/fig_curva_aprendizado_lstm.png
          EOF

          CHANGED="$(git status --porcelain | sed -E 's/^...//')"
          INESPERADOS=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if ! grep -qxF "$path" "$ALLOWLIST"; then
              INESPERADOS="${INESPERADOS}${path}\n"
            fi
          done <<< "$CHANGED"

          if [ -n "$INESPERADOS" ]; then
            echo "ERRO: figuras_artigo alterou arquivo fora da allowlist." >&2
            printf '%b' "$INESPERADOS" >&2
            exit 1
          fi
          echo "Allowlist conferida: somente os 12 caminhos autorizados foram alterados (ou nenhum)."

      - name: Publicar figuras regeneradas como artefato
        if: ${{ github.event.inputs.tarefa == 'figuras_artigo' }}
        uses: actions/upload-artifact@v4
        with:
          name: figuras-artigo-regeneradas
          path: |
            04_artigo/figuras/fig_pipeline_governanca.pdf
            04_artigo/figuras/fig_pipeline_governanca.png
            04_artigo/figuras/fig_tradeoff_custo.pdf
            04_artigo/figuras/fig_tradeoff_custo.png
            04_artigo/figuras/fig_confianca_desfecho.pdf
            04_artigo/figuras/fig_confianca_desfecho.png
            04_artigo/figuras/fig_calor_categorias.pdf
            04_artigo/figuras/fig_calor_categorias.png
            04_artigo/figuras/fig_matriz_confusao.pdf
            04_artigo/figuras/fig_matriz_confusao.png
            04_artigo/figuras/fig_curva_aprendizado_lstm.pdf
            04_artigo/figuras/fig_curva_aprendizado_lstm.png
          if-no-files-found: error
          retention-days: 30

      - name: Congelar alvo do ensemble
        if: ${{ github.event.inputs.tarefa == 'congelar_alvo_ensemble' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          test "$SPREADSHEET_ID" = "1lohPUQOgxzt_DMxnNLKMxnieZq1sVmh4uwBLbbgvfiQ"
          python src/congelar_alvo_ensemble.py

      - name: Commitar congelamento do alvo do ensemble
        if: ${{ github.event.inputs.tarefa == 'congelar_alvo_ensemble' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados/ensemble/ docs/CONGELAMENTO_ALVO_ENSEMBLE.md
          if git diff --cached --quiet; then
            echo "Sem artefatos de congelamento novos para commitar."
          else
            git commit -m "Congela alvo do ensemble"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push rejeitado (tentativa $i/5); novo rebase em 5s"
              sleep 5
            done
            echo "push falhou apos 5 tentativas" >&2
            exit 1
          fi

      - name: Remover credencial e cache temporarios
        if: ${{ always() }}
        run: |
          rm -f credenciais_sa.json dados/cache_planilha.json

      - name: Commitar resultados
        if: ${{ github.event.inputs.tarefa != 'congelar_alvo_ensemble' && github.event.inputs.tarefa != 'figuras_artigo' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_artigo/figuras
          if git diff --cached --quiet; then
            echo "Sem resultados novos para commitar."
          else
            git commit -m "Atualiza resultados LSTM do artigo"
            # Rebase antes do push: a branch pode ter avancado durante a execucao
            # (os fluxos de 15 min commitam dados). Sem isso o push e rejeitado por
            # non-fast-forward e o resultado do run e perdido -- ver run de 27/07.
            # Mesmo laco ja usado em transformer_ft.yml.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push rejeitado (tentativa $i/5); novo rebase em 5s"
              sleep 5
            done
            echo "push falhou apos 5 tentativas" >&2
            exit 1
          fi
