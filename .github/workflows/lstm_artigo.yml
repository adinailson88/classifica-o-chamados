name: Pendencias artigo com credencial

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "tabela_s1, history, diagnostico_ablation, diagnostico_protocolo_ablation, diagnostico_materializacao_lstm, ablation, limpar_multimodelo, sensibilidade_vies, holdout_vs_kfold, kfold_vs_groupkfold, figuras_artigo, congelar_alvo_ensemble ou gate2a_proveniencia_textual"
        required: true
        default: "tabela_s1"
        type: choice
        options:
          - tabela_s1
          - history
          - diagnostico_ablation
          - diagnostico_protocolo_ablation
          - diagnostico_materializacao_lstm
          - ablation
          - limpar_multimodelo
          - sensibilidade_vies
          - holdout_vs_kfold
          - kfold_vs_groupkfold
          - figuras_artigo
          - congelar_alvo_ensemble
          - gate2a_proveniencia_textual
      epochs:
        description: "Epocas de treino"
        required: false
        default: "15"
      k_folds:
        description: "Folds para ablation"
        required: false
        default: "3"
      modelos_limpeza:
        description: "Modelos para limpar_multimodelo ('comparaveis' = 7, sem transformer_ft, ou lista separada por virgula)"
        required: false
        default: "comparaveis"
      aplicar_limpeza:
        description: "limpar_multimodelo: false = so conta (dry-run); true = apaga de verdade"
        required: false
        default: false
        type: boolean
      gate2a_spreadsheet_id:
        description: "gate2a_proveniencia_textual: ID da planilha candidata a auditar"
        required: false
        default: ""
      gate2a_sheet_name:
        description: "gate2a_proveniencia_textual: nome da aba com os quatro campos textuais"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  lstm-artigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install matplotlib tensorflow scikit-learn statsmodels

      - name: Preparar credencial da planilha
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_SA_KEY"
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json

      - name: Validar sintaxe e testes
        run: |
          python -m py_compile src/exportar_tabela_por_categoria.py src/modelo_lstm.py src/ablation_lstm.py src/limpar_classif_multimodelo.py src/analise_sensibilidade_vies_validacao.py src/comparacao_holdout_kfold.py src/comparacao_kfold_groupkfold.py src/congelar_alvo_ensemble.py src/auditar_gate2a_fonte_historica.py
          python -m unittest discover -s tests

      - name: Exportar tabela S1 da aba viva
        if: ${{ github.event.inputs.tarefa == 'tabela_s1' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/exportar_tabela_por_categoria.py

      - name: Gerar history real do LSTM
        if: ${{ github.event.inputs.tarefa == 'history' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/modelo_lstm.py --epochs "${{ github.event.inputs.epochs }}"

      - name: Rodar ablation real do LSTM
        if: ${{ github.event.inputs.tarefa == 'ablation' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/ablation_lstm.py --epochs "${{ github.event.inputs.epochs }}" --k-folds "${{ github.event.inputs.k_folds }}"

      - name: Diagnosticar duplicatas entre folds do ablation
        if: ${{ github.event.inputs.tarefa == 'diagnostico_ablation' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/ablation_lstm.py --diagnostico-only --k-folds "${{ github.event.inputs.k_folds }}"

      - name: Diagnosticar protocolo residual do ablation
        if: ${{ github.event.inputs.tarefa == 'diagnostico_protocolo_ablation' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/ablation_lstm.py --diagnostico-protocolo-only --k-folds "${{ github.event.inputs.k_folds }}"

      - name: Diagnosticar materializacao oficial nova do LSTM
        if: ${{ github.event.inputs.tarefa == 'diagnostico_materializacao_lstm' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/ablation_lstm.py --diagnostico-materializacao-oficial-only

      - name: Limpar CLASSIF__/turnos/metricas para forcar rematerializacao
        if: ${{ github.event.inputs.tarefa == 'limpar_multimodelo' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          if [ "${{ github.event.inputs.aplicar_limpeza }}" = "true" ]; then
            python src/limpar_classif_multimodelo.py --modelos "${{ github.event.inputs.modelos_limpeza }}" --aplicar
          else
            python src/limpar_classif_multimodelo.py --modelos "${{ github.event.inputs.modelos_limpeza }}"
          fi

      - name: Quantificar vies estrutural da amostra validada
        if: ${{ github.event.inputs.tarefa == 'sensibilidade_vies' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/analise_sensibilidade_vies_validacao.py

      - name: Comparar holdout fixo (85/15) com a referencia k-fold
        if: ${{ github.event.inputs.tarefa == 'holdout_vs_kfold' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/comparacao_holdout_kfold.py

      - name: Comparar KFold por linha com GroupKFold por hash de texto
        if: ${{ github.event.inputs.tarefa == 'kfold_vs_groupkfold' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/comparacao_kfold_groupkfold.py --k-folds "${{ github.event.inputs.k_folds }}"

      # As seis figuras leem apenas JSON ja versionado, sem credencial de planilha.
      - name: Regerar as figuras do artigo (PDF vetorial + PNG 300 dpi)
        if: ${{ github.event.inputs.tarefa == 'figuras_artigo' }}
        run: |
          python src/gerar_figura1_pipeline.py
          python src/gerar_figura2_confianca_desfecho.py
          python src/gerar_figura3_tradeoff_custo.py
          python src/gerar_figura4_confusoes.py
          python src/gerar_figura5_curva_aprendizado.py
          python src/gerar_figura6_ablation.py
          python src/gerar_figura7_mapas_calor.py

      - name: Congelar alvo do ensemble
        if: ${{ github.event.inputs.tarefa == 'congelar_alvo_ensemble' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          test "$SPREADSHEET_ID" = "1lohPUQOgxzt_DMxnNLKMxnieZq1sVmh4uwBLbbgvfiQ"
          python src/congelar_alvo_ensemble.py

      - name: Commitar congelamento do alvo do ensemble
        if: ${{ github.event.inputs.tarefa == 'congelar_alvo_ensemble' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados/ensemble/ docs/CONGELAMENTO_ALVO_ENSEMBLE.md
          if git diff --cached --quiet; then
            echo "Sem artefatos de congelamento novos para commitar."
          else
            git commit -m "Congela alvo do ensemble"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push rejeitado (tentativa $i/5); novo rebase em 5s"
              sleep 5
            done
            echo "push falhou apos 5 tentativas" >&2
            exit 1
          fi

      - name: "Gate 2A: auditar proveniencia textual de fonte historica candidata"
        if: ${{ github.event.inputs.tarefa == 'gate2a_proveniencia_textual' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          test -n "${{ github.event.inputs.gate2a_spreadsheet_id }}"
          test -n "${{ github.event.inputs.gate2a_sheet_name }}"
          git fetch origin main --depth=1
          BASE_MAIN_SHA=$(git rev-parse origin/main)
          echo "base_main_sha=$BASE_MAIN_SHA"
          python src/auditar_gate2a_fonte_historica.py \
            --spreadsheet-id "${{ github.event.inputs.gate2a_spreadsheet_id }}" \
            --aba "${{ github.event.inputs.gate2a_sheet_name }}" \
            --base-main-sha "$BASE_MAIN_SHA" \
            --workflow-head-sha "${{ github.sha }}" \
            --saida dados/gate2a_resultado.json

      - name: "Gate 2A: publicar resultado sanitizado como artefato"
        if: ${{ always() && github.event.inputs.tarefa == 'gate2a_proveniencia_textual' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-resultado
          path: dados/gate2a_resultado.json
          if-no-files-found: error
          retention-days: 14

      - name: Remover credencial e cache temporarios
        if: ${{ always() }}
        run: |
          rm -f credenciais_sa.json dados/cache_planilha.json dados/gate2a_resultado.json

      - name: Commitar resultados
        if: ${{ github.event.inputs.tarefa != 'congelar_alvo_ensemble' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_artigo/figuras
          if git diff --cached --quiet; then
            echo "Sem resultados novos para commitar."
          else
            git commit -m "Atualiza resultados LSTM do artigo"
            # Rebase antes do push: a branch pode ter avancado durante a execucao
            # (os fluxos de 15 min commitam dados). Sem isso o push e rejeitado por
            # non-fast-forward e o resultado do run e perdido -- ver run de 27/07.
            # Mesmo laco ja usado em transformer_ft.yml.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push rejeitado (tentativa $i/5); novo rebase em 5s"
              sleep 5
            done
            echo "push falhou apos 5 tentativas" >&2
            exit 1
          fi
