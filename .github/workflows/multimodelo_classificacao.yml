name: Multimodelo - classificacao completa

# Materializa CLASSIF__<modelo> para cada IA selecionada, com predicao
# out-of-fold e lote dinamico.
#
# AUTOMATICO A CADA 15 MIN (MESMO CRON DA ETAPA 1/LSTM), TODOS OS 8 MODELOS
# (leves + pesados/LSTM/transformer_ft): classificam os chamados novos no
# mesmo ritmo do LSTM oficial. max_turnos=0 = todos os pendentes. E incremental
# e barato depois da materializacao inicial: classificacao_multimodelo.py so
# processa as linhas ainda nao feitas e encerra rapido quando nao ha pendentes
# (no-op) — so fica pesado de novo apos um reset ou grande avanco da base.
# Serializado com a Etapa 1 e o dashboard pelo concurrency 'escrita-planilha'
# (um escritor por vez).

on:
  # A cada 15 min, mas DESLOCADO 5 min da Etapa 1/LSTM (que roda em :00/:15/:30/:45)
  # para nao baterem na API da planilha ao mesmo tempo (reduz erros 5xx/429 transitorios).
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      modelos:
        description: "leves, pesados, todos ou lista separada por virgula"
        default: "leves"
      max_turnos:
        description: "Turnos de 15 por modelo (0 = todos os pendentes)"
        default: "0"
      aplicar:
        description: "Gravar na planilha"
        type: boolean
        default: false
      lstm_perfil:
        description: "Perfil LSTM"
        type: choice
        default: padrao
        options:
          - padrao
          - robusto

concurrency:
  group: multimodelo-classif
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      executar: ${{ steps.g.outputs.executar }}
      valor_atual: ${{ steps.g.outputs.valor_atual }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Avaliar avanco da base (>=1000 chamados ou multimodelo vazio)
        id: g
        run: python src/guard_automacao.py --chave multimodelo_classificacao --metrica registros --limiar 1000 --forcar-se-aba-zero multimodelo_metricas

  multimodelo:
    needs: guard
    # Roda no cron diario (acompanha a Etapa 1), no disparo manual, ou quando a guarda
    # de avanco aprovar. O custo e barato quando nao ha pendentes (no-op no script).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.guard.outputs.executar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      LSTM_PERFIL: ${{ github.event.inputs.lstm_perfil || 'padrao' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-leves.txt
            requirements.txt
      - name: Dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: TensorFlow se LSTM estiver no escopo
        if: ${{ github.event_name == 'schedule' || contains(github.event.inputs.modelos, 'lstm') || github.event.inputs.modelos == 'pesados' || github.event.inputs.modelos == 'todos' }}
        run: python -m pip install --retries 5 --timeout 120 tensorflow==2.17.0
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Classificar por modelo
        env:
          MODELOS: ${{ github.event.inputs.modelos || 'todos' }}
          MAX_TURNOS: ${{ github.event.inputs.max_turnos || '0' }}
        run: |
          # No cron (schedule) materializa TODOS os 8 modelos (leves + pesados);
          # manual respeita o input 'modelos'/'aplicar'.
          APLICAR=""
          if [ "${{ github.event.inputs.aplicar }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            APLICAR="--aplicar"
          fi
          python src/classificacao_multimodelo.py --modelos "$MODELOS" --max-turnos "$MAX_TURNOS" $APLICAR
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Registrar marcador e commit do estado
        run: |
          python src/guard_automacao.py --registrar --chave multimodelo_classificacao --valor '${{ needs.guard.outputs.valor_atual || '0' }}'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/estado_automacao.json
          git diff --cached --quiet && { echo "sem mudanca no estado"; exit 0; }
          git commit -m "estado automacao: multimodelo_classificacao [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1
