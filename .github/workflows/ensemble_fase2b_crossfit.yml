name: Fase 2B - cross-fitting aninhado dos sete modelos-base (read-only)

on:
  push:
    branches:
      - feat/ensemble-fase2b-crossfit-base

permissions:
  contents: read

env:
  # Determinismo: fixado ANTES de qualquer processo Python iniciar (PYTHONHASHSEED
  # so tem efeito definido no arranque do interpretador). BLAS de 1 thread evita que
  # soma de ponto-flutuante multi-thread mude margens perto de fronteiras de decisao
  # entre execucoes (mesma razao do recongelamento online). TF_DETERMINISTIC_OPS e
  # TF_ENABLE_ONEDNN_OPTS=0 fixam o comportamento numerico das operacoes do
  # TensorFlow usadas pela LSTM.
  PYTHONHASHSEED: "42"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TF_DETERMINISTIC_OPS: "1"
  TF_ENABLE_ONEDNN_OPTS: "0"
  TF_CPP_MIN_LOG_LEVEL: "2"
  SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

jobs:
  testes:
    name: Testes (suite completa, sempre roda)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: |
          python -m pip install --retries 5 --timeout 300 -r requirements.txt
          python -m pip install --retries 5 --timeout 120 scipy==1.14.1 statsmodels==0.14.4 matplotlib
      - name: py_compile + unittest discover
        run: |
          python -m py_compile src/*.py
          python -m unittest discover -s tests

  autorizacao:
    name: Autorizacao da execucao cientifica (marcador [FASE2B-RUN])
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      autorizado: ${{ steps.checar.outputs.autorizado }}
    steps:
      - name: Checar marcador no INICIO da primeira linha do commit
        id: checar
        env:
          # Passado via env, nunca interpolado direto no `run:`, para nao expor
          # o runner a injecao de shell a partir de uma mensagem de commit
          # controlada pelo autor do push.
          MENSAGEM_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          PRIMEIRA_LINHA=$(printf '%s\n' "$MENSAGEM_COMMIT" | head -n1)
          echo "Primeira linha do commit: $PRIMEIRA_LINHA"
          # `contains()` sobre a mensagem inteira e fragil: um commit que so
          # DESCREVE o marcador em prosa (ex.: documentando o proprio
          # workflow) tambem "contem" a substring em algum lugar do corpo e
          # dispararia a rodada pesada por acidente. Por isso o gate exige
          # que o marcador seja PREFIXO da PRIMEIRA linha (o assunto do
          # commit), nunca uma ocorrencia solta em qualquer lugar da mensagem.
          if [[ "$PRIMEIRA_LINHA" == "[FASE2B-RUN]"* ]]; then
            echo "autorizado=true" >> "$GITHUB_OUTPUT"
            echo "Marcador [FASE2B-RUN] no inicio do assunto do commit: execucao cientifica AUTORIZADA."
          else
            echo "autorizado=false" >> "$GITHUB_OUTPUT"
            echo "Marcador [FASE2B-RUN] ausente no inicio do assunto do commit: execucao cientifica NAO autorizada (somente testes)."
          fi

  gate_zero:
    name: Gate Zero (releitura online + validacao de hashes, sem treinar)
    needs: [testes, autorizacao]
    if: needs.autorizacao.outputs.autorizado == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: |
          python -m pip install --retries 5 --timeout 300 -r requirements.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Gate Zero
        id: gate_zero
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          mkdir -p docs/dados/ensemble/fase2b
          python src/ensemble_fase2b_crossfit.py --somente-gate-zero \
            --saida-dir docs/dados/ensemble/fase2b
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Publicar artefato sanitizado do Gate Zero
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2b-gate-zero
          path: docs/dados/ensemble/fase2b/fase2b_gate_zero.json
          if-no-files-found: warn
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.gate_zero.outcome == 'failure'
        run: |
          echo "Gate Zero BLOQUEADO: a planilha online diverge do congelamento ja aprovado, ou as contagens estruturais nao batem. Nenhum modelo foi treinado." >&2
          exit 1

  crossfit_fold:
    name: Cross-fitting por outer fold
    needs: [gate_zero, autorizacao]
    if: needs.autorizacao.outputs.autorizado == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        outer_fold: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: |
          python -m pip install --retries 5 --timeout 300 -r requirements.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Cross-fitting do outer fold ${{ matrix.outer_fold }}
        id: crossfit
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          mkdir -p docs/dados/ensemble/fase2b
          python src/ensemble_fase2b_crossfit.py --outer-fold ${{ matrix.outer_fold }} \
            --saida-dir docs/dados/ensemble/fase2b
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Publicar scores parciais sanitizados (outer fold ${{ matrix.outer_fold }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2b-fold-${{ matrix.outer_fold }}
          path: |
            docs/dados/ensemble/fase2b/fase2b_fold_${{ matrix.outer_fold }}_scores.npz
            docs/dados/ensemble/fase2b/fase2b_fold_${{ matrix.outer_fold }}_fits.json
          if-no-files-found: warn
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.crossfit.outcome == 'failure'
        run: |
          echo "Cross-fitting do outer fold ${{ matrix.outer_fold }} BLOQUEADO (vazamento, fallback de LSTM ou divergencia estrutural). Consulte o log do passo anterior." >&2
          exit 1

  agregar:
    name: Agregacao final + hashes cientificos
    needs: [crossfit_fold, autorizacao]
    if: needs.autorizacao.outputs.autorizado == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: |
          python -m pip install --retries 5 --timeout 300 -r requirements.txt
      - name: Baixar scores parciais dos 5 outer folds
        uses: actions/download-artifact@v4
        with:
          pattern: fase2b-fold-*
          path: docs/dados/ensemble/fase2b
          merge-multiple: true
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Agregar e validar as 20 invariantes obrigatorias
        id: agregar
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          # Via env, nao interpolado direto no `run:` (mesma razao do passo
          # de autorizacao): evita injecao de shell a partir da mensagem de
          # commit. So vai para fase2b_proveniencia_run.json (metadado
          # volatil), nunca entra nos hashes cientificos.
          MENSAGEM_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          python src/ensemble_fase2b_crossfit.py --agregar \
            --entrada-dir docs/dados/ensemble/fase2b \
            --saida-dir docs/dados/ensemble/fase2b \
            --run-id "$RUN_ID" \
            --commit-sha "$COMMIT_SHA" \
            --execucao "$MENSAGEM_COMMIT"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Publicar resultado cientifico (manifesto, resumo, hashes e arrays)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2b-resultado-cientifico
          path: |
            docs/dados/ensemble/fase2b/fase2b_manifesto.json
            docs/dados/ensemble/fase2b/fase2b_resumo.json
            docs/dados/ensemble/fase2b/fase2b_hashes.json
            docs/dados/ensemble/fase2b/fase2b_proveniencia_run.json
            docs/dados/ensemble/fase2b/fase2b_inner_scores.npz
            docs/dados/ensemble/fase2b/fase2b_outer_scores.npz
          if-no-files-found: warn
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.agregar.outcome == 'failure'
        run: |
          echo "Agregacao BLOQUEADA: contagem de fits, LSTM ou cardinalidade de previsoes nao bateu com o esperado. Rodada nao e valida." >&2
          exit 1
