name: Custo computacional canonico (read-only)

on:
  workflow_dispatch:
    inputs:
      repeticoes:
        description: "Execucoes por modelo; a mediana e reportada"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 300 -r requirements.txt
      - name: Testes da medicao
        run: python -m unittest discover -s tests -p "test_custo_computacional_canonico.py" -t tests
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Medir sem escrever na planilha
        id: custo
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: python src/custo_computacional_canonico.py --repeticoes "${{ inputs.repeticoes }}"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Publicar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custo-computacional-canonico
          path: |
            docs/dados/custo_computacional_canonico.json
            docs/CUSTO_COMPUTACIONAL_CANONICO.md
          if-no-files-found: error
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.custo.outcome == 'failure'
        run: |
          echo "Medicao falhou; consulte o log." >&2
          exit 1
