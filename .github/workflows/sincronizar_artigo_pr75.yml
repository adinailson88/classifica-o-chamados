name: Sincronizar artigo PR 75

on:
  push:
    branches: [agent/corrigir-sincronizacao-artigo]
  workflow_dispatch:

concurrency:
  group: sincronizar-artigo-pr75
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/corrigir-sincronizacao-artigo
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-leves.txt"

      - name: Instalar dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt

      - name: Corrigir e compilar sincronizador
        run: |
          python src/corrigir_sintaxe_sincronizador.py
          python -m py_compile src/sincronizar_artigo_dados.py

      - name: Atualizar artigo e plano a partir dos agregados
        continue-on-error: true
        run: |
          mkdir -p docs/diagnosticos
          set +e
          python src/sincronizar_artigo_dados.py > docs/diagnosticos/sincronizador_local_pr75.log 2>&1
          status=$?
          echo "exit_status=$status" > docs/diagnosticos/sincronizador_local_pr75.status
          cat docs/diagnosticos/sincronizador_local_pr75.log
          exit $status

      - name: Validar alteracoes
        continue-on-error: true
        run: |
          mkdir -p docs/diagnosticos
          set +e
          {
            python -m unittest tests.test_calibracao_deduplicada -v
            python src/check_final_ready.py
          } > docs/diagnosticos/validacao_local_pr75.log 2>&1
          status=$?
          echo "exit_status=$status" > docs/diagnosticos/validacao_local_pr75.status
          cat docs/diagnosticos/validacao_local_pr75.log
          exit $status

      - name: Commitar texto ou diagnostico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/sincronizar_artigo_dados.py 04_artigo/artigo_classificacao_chamados_v3.md PLANO_ARTIGO_CAPITULO.md docs/diagnosticos
          if git diff --cached --quiet; then
            echo "Texto ja sincronizado e sem novo diagnostico."
            exit 0
          fi
          git commit -m "docs: atualiza artigo com metricas vigentes [skip ci]"
          git push origin HEAD:agent/corrigir-sincronizacao-artigo
