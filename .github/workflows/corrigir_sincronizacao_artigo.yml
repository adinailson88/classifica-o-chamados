name: Corrigir sincronizacao numerica do artigo

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: corrigir-sincronizacao-artigo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/corrigir-sincronizacao-artigo
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-leves.txt"

      - name: Instalar dependencias
        run: |
          python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
          python -m pip install --retries 5 --timeout 120 matplotlib

      - name: Aplicar correcao idempotente de sintaxe
        run: python src/corrigir_sintaxe_sincronizador.py

      - name: Compilar novos scripts
        run: python -m py_compile src/calibracao_deduplicada.py src/exportar_dashboard_corrigido.py src/sincronizar_artigo_dados.py

      - name: Testar deduplicacao isoladamente
        run: python -m unittest tests.test_calibracao_deduplicada -v

      - name: Registrar diagnostico da suite completa
        continue-on-error: true
        run: |
          mkdir -p docs/diagnosticos
          set +e
          python -m unittest discover -s tests > docs/diagnosticos/testes_pr75.log 2>&1
          status=$?
          echo "exit_status=$status" > docs/diagnosticos/testes_pr75.status
          tail -n 120 docs/diagnosticos/testes_pr75.log
          exit $status

      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json

      - name: Regenerar calibracao deduplicada
        run: python src/calibracao_deduplicada.py

      - name: Auditar conferencias M N P
        run: python src/auditar_conferencias.py

      - name: Regenerar avaliacao final
        run: python src/avaliacao_final.py

      - name: Registrar diagnostico da estatistica multimodelo
        continue-on-error: true
        run: |
          mkdir -p docs/diagnosticos
          set +e
          python src/analise_estatistica.py > docs/diagnosticos/estatistica_pr75.log 2>&1
          status=$?
          echo "exit_status=$status" > docs/diagnosticos/estatistica_pr75.status
          cat docs/diagnosticos/estatistica_pr75.log
          exit $status

      - name: Regenerar sensibilidade do vies de validacao
        run: python src/analise_sensibilidade_vies_validacao.py

      - name: Regenerar Figuras 2 e 3
        run: |
          python src/gerar_figura2_confianca_desfecho.py
          python src/gerar_figura3_tradeoff_custo.py

      - name: Registrar diagnostico do sincronizador
        continue-on-error: true
        run: |
          mkdir -p docs/diagnosticos
          set +e
          python src/sincronizar_artigo_dados.py > docs/diagnosticos/sincronizador_pr75.log 2>&1
          status=$?
          echo "exit_status=$status" > docs/diagnosticos/sincronizador_pr75.status
          cat docs/diagnosticos/sincronizador_pr75.log
          exit $status

      - name: Registrar validacao final
        continue-on-error: true
        run: |
          mkdir -p docs/diagnosticos
          set +e
          {
            python -m py_compile src/calibracao_deduplicada.py src/exportar_dashboard_corrigido.py src/sincronizar_artigo_dados.py
            python -m unittest tests.test_calibracao_deduplicada -v
            python src/check_final_ready.py
          } > docs/diagnosticos/validacao_final_pr75.log 2>&1
          status=$?
          echo "exit_status=$status" > docs/diagnosticos/validacao_final_pr75.status
          cat docs/diagnosticos/validacao_final_pr75.log
          exit $status

      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json

      - name: Commitar resultados na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/sincronizar_artigo_dados.py docs/dados docs/diagnosticos 04_artigo/artigo_classificacao_chamados_v3.md 04_artigo/figuras PLANO_ARTIGO_CAPITULO.md
          if git diff --cached --quiet; then
            echo "Nenhum artefato foi alterado."
            exit 0
          fi
          git commit -m "docs: sincroniza artigo com dados vivos [skip ci]"
          git push origin HEAD:agent/corrigir-sincronizacao-artigo
