name: Diagnostico sessao 23-07-2026 (mojibake + duplicacao RF)

# Uso unico, read-only: investiga duas pendencias tecnicas registradas em
# PLANO_ARTIGO_CAPITULO.md. Nao escreve na planilha. Este workflow e removido
# do repositorio depois de usado (ver commit que o adiciona).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Rodar diagnostico
        run: python src/diagnostico_sessao_20260723.py
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
