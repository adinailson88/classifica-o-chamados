name: Transformer fine-tuning (BERTimbau)

# BERTimbau (transformer pre-treinado em portugues) com FINE-TUNING — o 8o modelo,
# comparavel aos 7. PESADO: torch + transformers, treina em CPU no runner GitHub-hosted.
#
# LIMITE REAL DO RUNNER: runners GitHub-hosted tem teto RIGIDO de 6 h por job. Por isso
# este workflow NAO confia em timeout-minutes alto (acima de 6 h nao tem efeito) — usa
# timeout-minutes=330 (abaixo do teto) e um ORCAMENTO DE TEMPO interno
# (TRANSFORMER_TIME_BUDGET_S) para o treino encerrar sozinho, salvando o melhor modelo,
# antes de ser morto pelo GitHub. Fine-tuning de base inteira (~13.8k) em CPU NAO cabe
# em 6 h: o modo automatico usa subamostragem estratificada + early stopping; a fidelidade
# total (base inteira) exige modo manual com self-hosted runner ou divisao do treino.
#
# Acoes:
#   - reclassificar_validados: refaz a coluna O dos chamados validados (M e N) com o
#     BERTimbau fine-tuned.
#   - comparar: avalia o transformer numa janela held-out e grava em COMPARACAO_MODELOS
#     (acuracia, F1 macro e por categoria, matriz) -> aba Modelos/Estatistica.

on:
  # Noturno: ~02:17 America/Bahia (UTC-3) = 05:17 UTC. Minuto 17 evita o pico do topo
  # da hora no GitHub Actions. Baixa frequencia (1x/dia) e condicionado por guarda.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "smoke | auto | manual | force | full | cluster_coreset"
        type: choice
        default: manual
        options:
          - smoke
          - auto
          - manual
          - force
          - full
          - cluster_coreset
      acao:
        description: "O que fazer (modos reais)"
        type: choice
        default: reclassificar_validados
        options:
          - reclassificar_validados
          - comparar
      forcar_treino:
        description: "Treinar mesmo sem 100 novas conferencias (nao ignora validacoes basicas)"
        type: boolean
        default: false
      max_epochs:
        description: "Epocas de fine-tuning (vazio = padrao do modo)"
        default: ""
      amostra_teste:
        description: "Para modo smoke: nº de exemplos sinteticos"
        default: "40"
      limite:
        description: "Para acao 'comparar': tamanho da janela held-out de teste"
        default: "500"
      coreset_max_total:
        description: "Para modo cluster_coreset: limite alvo de exemplos selecionados"
        default: "4000"
      selecao_treino:
        description: "Estrategia de selecao do treino (modos full/manual/force): none ou cluster_coreset"
        type: choice
        default: none
        options:
          - none
          - cluster_coreset
      publicar_dashboard:
        description: "Apos sucesso, deixar o dashboard.yml republicar (workflow_run)"
        type: boolean
        default: true

# Nao permite dois fine-tunings BERTimbau simultaneos. Grupo PROPRIO (nao 'escrita-planilha')
# para um treino de horas NAO bloquear etapa1/dashboard; a escrita final na coluna O e curta
# e tem retry proprio no script.
concurrency:
  group: bertimbau-finetune
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      modo: ${{ steps.modo.outputs.modo }}
      treinar: ${{ steps.decidir.outputs.treinar }}
      valor_atual: ${{ steps.guard.outputs.valor_atual }}
      motivo: ${{ steps.guard.outputs.motivo }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: modo
        run: |
          MODO="${{ github.event.inputs.modo || 'auto' }}"
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODO (evento: ${{ github.event_name }})"
      - name: Validar secrets (modos reais; smoke dispensa)
        if: ${{ steps.modo.outputs.modo != 'smoke' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          falta=""
          [ -z "$SPREADSHEET_ID" ] && falta="$falta SPREADSHEET_ID"
          [ -z "$GCP_SA_KEY" ] && falta="$falta GCP_SA_KEY"
          if [ -n "$falta" ]; then
            echo "::error::Secrets ausentes:$falta — necessarios para o modo '${{ steps.modo.outputs.modo }}'. Rode com modo=smoke para validar sem secrets."
            exit 1
          fi
          echo "Secrets necessarios presentes (conteudo nao exibido)."
      - id: guard
        name: Guarda de avanco (100 novas conferencias) — so no modo auto sem forcar
        run: |
          MODO="${{ steps.modo.outputs.modo }}"
          FORCAR="${{ github.event.inputs.forcar_treino || 'false' }}"
          if [ "$MODO" = "auto" ] && [ "$FORCAR" != "true" ]; then
            python src/guard_automacao.py --chave transformer_ft --metrica validados --limiar 100
          else
            echo "executar=true" >> "$GITHUB_OUTPUT"
            echo "valor_atual=0" >> "$GITHUB_OUTPUT"
            echo "motivo=guarda ignorada (modo=$MODO, forcar=$FORCAR)" >> "$GITHUB_OUTPUT"
            echo "Guarda ignorada (modo=$MODO, forcar=$FORCAR)."
          fi
      - id: decidir
        run: echo "treinar=${{ steps.guard.outputs.executar }}" >> "$GITHUB_OUTPUT"

  smoke:
    needs: preparar
    if: ${{ needs.preparar.outputs.modo == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-leves.txt
            requirements-transformer.txt
      - name: Cache do Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bertimbau
      - name: Dependencias
        run: |
          python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
          python -m pip install --retries 5 --timeout 600 -r requirements-transformer.txt
      - name: Smoke test (sintetico, sem planilha)
        run: python src/smoke_transformer.py --n "${{ github.event.inputs.amostra_teste || '40' }}"

  cluster_coreset:
    needs: preparar
    if: ${{ needs.preparar.outputs.modo == 'cluster_coreset' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "::error::Secret GCP_SA_KEY ausente."; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Gerar diagnostico cluster_coreset (sem treino)
        run: |
          python src/bertimbau_coreset.py --max-total "${{ github.event.inputs.coreset_max_total || '4000' }}"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Commit dos relatorios agregados do coreset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados/bertimbau_coreset_resumo.json docs/dados/bertimbau_token_stats.json docs/dados/bertimbau_cluster_report.json docs/dados/bertimbau_review_queue.json dados/bertimbau_coreset_ids.json
          git diff --cached --quiet && { echo "sem mudanca nos relatorios"; exit 0; }
          git commit -m "dados BERTimbau: cluster coreset experimental [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1

  treinar:
    needs: preparar
    if: ${{ needs.preparar.outputs.treinar == 'true' && needs.preparar.outputs.modo != 'smoke' && needs.preparar.outputs.modo != 'cluster_coreset' }}
    runs-on: ubuntu-latest
    # Abaixo do teto rigido de 6 h do runner GitHub-hosted (acima de 360 nao tem efeito).
    timeout-minutes: 330
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      # Orcamento de tempo interno: 300 min < 330 do job < 360 do runner. Deixa margem
      # para download do modelo, escrita na coluna O e commit antes do teto.
      TRANSFORMER_TIME_BUDGET_S: "18000"
      TRANSFORMER_EARLY_STOP: "1"
      TRANSFORMER_EPOCHS: ${{ github.event.inputs.max_epochs || '4' }}
      # Modo auto: subamostra estratificada para CABER em CPU/6h. manual/force/full: base inteira.
      TRANSFORMER_MAX_TRAIN: ${{ needs.preparar.outputs.modo == 'auto' && '4000' || '0' }}
      # Selecao experimental do treino: none (default) ou cluster_coreset (treina sobre o
      # coreset, para gerar metricas comparaveis com o full via src/comparar_coreset.py).
      TRANSFORMER_SELECT: ${{ github.event.inputs.selecao_treino || 'none' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-leves.txt
            requirements-transformer.txt
      - name: Cache do Hugging Face (modelo + tokenizer)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bertimbau
      - name: Instalar dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Instalar transformer (torch + transformers)
        run: python -m pip install --retries 5 --timeout 600 -r requirements-transformer.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "::error::Secret GCP_SA_KEY ausente."; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Executar fine-tuning
        id: treino
        run: |
          echo "Modo=${{ needs.preparar.outputs.modo }} | acao=${{ github.event.inputs.acao || 'reclassificar_validados' }} | MAX_TRAIN=$TRANSFORMER_MAX_TRAIN | SELECT=$TRANSFORMER_SELECT | epochs=$TRANSFORMER_EPOCHS"
          if [ "${{ github.event.inputs.acao }}" = "comparar" ]; then
            # Nome do JSON de metricas por estrategia de selecao, para comparar full vs coreset.
            SEL="${{ github.event.inputs.selecao_treino || 'none' }}"
            [ "$SEL" = "cluster_coreset" ] && METR="docs/dados/bertimbau_metr_coreset.json" || METR="docs/dados/bertimbau_metr_full.json"
            python src/comparar_modelos_lote.py --modelo transformer_ft --inicio 0 --limite "${{ github.event.inputs.limite || '500' }}" --aplicar --metricas-json "$METR"
            echo "METR_JSON=$METR" >> "$GITHUB_ENV"
          else
            python src/reclassificar_validados.py --modelo transformer_ft --max-turnos 0 --aplicar
          fi
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Registrar estado do treino + marcador da guarda
        if: success()
        run: |
          python src/escrever_estado_bertimbau.py \
            --status ok \
            --modo "${{ needs.preparar.outputs.modo }}" \
            --acao "${{ github.event.inputs.acao || 'reclassificar_validados' }}" \
            --commit "${{ github.sha }}" \
            --motivo "treino concluido (modo ${{ needs.preparar.outputs.modo }})"
          python src/guard_automacao.py --registrar --chave transformer_ft --valor "${{ needs.preparar.outputs.valor_atual || '0' }}"
      - name: Commit do estado
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados/bertimbau_training_state.json dados/estado_automacao.json
          # Metricas da comparacao (full/coreset), quando geradas:
          git add docs/dados/bertimbau_metr_full.json docs/dados/bertimbau_metr_coreset.json 2>/dev/null || true
          git diff --cached --quiet && { echo "sem mudanca no estado"; exit 0; }
          git commit -m "estado BERTimbau: treino ${{ needs.preparar.outputs.modo }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1

  registrar_skip:
    needs: preparar
    if: ${{ needs.preparar.outputs.treinar != 'true' && needs.preparar.outputs.modo == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preservar o ultimo estado valido quando nao ha dados novos
        run: |
          echo "Sem 100 novas conferencias desde o ultimo treino — encerrando com sucesso."
          echo "bertimbau_training_state.json nao sera rebaixado para 'sem_dados'."
          echo "O ultimo status 'ok' continua sendo a referencia ate existir novo treino concluido."
