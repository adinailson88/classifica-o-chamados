name: Comparar modelos (lote)

# Roda 1 modelo (ou 'todos' os leves) sobre o MESMO lote [inicio, inicio+limite),
# na mesma ordem, e grava metricas comparaveis (COMPARACAO_MODELOS / _CATEGORIA /
# _PREVISOES). Nao altera o fluxo de classificacao (etapa1/etapa2).
#
# AUTOMATICO CONDICIONADO: 1x/dia, mas a comparacao so roda quando a base cresceu
# >= 1000 chamados desde a ultima vez OU quando ainda nao ha comparacao publicada.
# No cron usa o lote padrao (leves, 200) para custo baixo; varreduras completas
# (passo>0, lstm) continuam manuais. Disparo manual ignora a guarda e sempre roda.

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo (ou 'todos' = leves)"
        type: choice
        default: todos
        options:
          - todos
          - naive_bayes
          - regressao_logistica
          - linear_svc
          - sgd
          - extra_trees
          - random_forest
          - lstm
      inicio:
        description: "Indice inicial do lote"
        default: "0"
      limite:
        description: "Tamanho do lote (0 = todos)"
        default: "200"
      passo:
        description: "Se >0, ladrilha TODA a base nesse passo e substitui a tabela (cobertura completa)"
        default: "0"

concurrency:
  group: escrita-planilha
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      executar: ${{ steps.g.outputs.executar }}
      valor_atual: ${{ steps.g.outputs.valor_atual }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Avaliar avanco da base (>=1000 chamados ou comparacao vazia)
        id: g
        run: python src/guard_automacao.py --chave comparar_modelos --metrica registros --limiar 1000 --forcar-se-aba-zero comparacao_modelos

  comparar:
    needs: guard
    if: ${{ github.event_name == 'workflow_dispatch' || needs.guard.outputs.executar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-leves.txt
            requirements.txt
      - name: Dependencias (leves)
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: TensorFlow (apenas se modelo=lstm)
        if: ${{ github.event.inputs.modelo == 'lstm' }}
        run: python -m pip install --retries 5 --timeout 120 tensorflow==2.17.0
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Comparar
        run: |
          # No cron, ladrilha TODA a base em janelas de 1.000 (cobertura held-out completa,
          # nao so 0-200). No manual respeita o input 'passo'.
          PASSO="${{ github.event.inputs.passo || '0' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then PASSO="1000"; fi
          python src/comparar_modelos_lote.py \
            --modelo "${{ github.event.inputs.modelo || 'todos' }}" \
            --inicio "${{ github.event.inputs.inicio || '0' }}" \
            --limite "${{ github.event.inputs.limite || '200' }}" \
            --passo "$PASSO" \
            --aplicar
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Registrar marcador e commit do estado
        run: |
          python src/guard_automacao.py --registrar --chave comparar_modelos --valor '${{ needs.guard.outputs.valor_atual || '0' }}'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/estado_automacao.json
          git diff --cached --quiet && { echo "sem mudanca no estado"; exit 0; }
          git commit -m "estado automacao: comparar_modelos [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1
