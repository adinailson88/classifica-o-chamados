name: TEMPORARIO - limpar documentos obsoletos lote 2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporario_limpar_obsoletos_lote2.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: limpar-obsoletos-lote2
  cancel-in-progress: false

jobs:
  preparar-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Criar branch de limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c docs/remover-obsoletos-lote2

      - name: Remover arquivos e corrigir referências
        run: |
          python - <<'PY'
          from pathlib import Path

          remover = [
              Path("docs/RELATORIO_ESTADO_ATUAL.md"),
              Path("PLANO_CALIBRACAO.md"),
              Path("OBJETIVO_FINAL_MODELO_IA.txt"),
              Path("apps_script/Code.gs"),
              Path("docs/GUIA_TECNICO.md"),
          ]
          for caminho in remover:
              if caminho.exists():
                  caminho.unlink()

          substituicoes = {
              "`docs/GUIA_TECNICO.md`": "`README.md`",
              "docs/GUIA_TECNICO.md": "README.md",
              "`PLANO_CALIBRACAO.md`": "`src/calibracao_modelos.py` e `src/calibracao_confianca.py`",
              "PLANO_CALIBRACAO.md": "src/calibracao_modelos.py e src/calibracao_confianca.py",
              "`OBJETIVO_FINAL_MODELO_IA.txt`": "`README.md`",
              "OBJETIVO_FINAL_MODELO_IA.txt": "README.md",
              "`apps_script/Code.gs`": "integração Apps Script legada",
              "apps_script/Code.gs": "integração Apps Script legada",
              "`docs/RELATORIO_ESTADO_ATUAL.md`": "histórico do Git",
              "docs/RELATORIO_ESTADO_ATUAL.md": "histórico do Git",
              "`FALTA_FAZER.md`": "`CONTEXTO.md`",
              "FALTA_FAZER.md": "CONTEXTO.md",
              "`CONTEXTO_ESTATISTICA_CLASSIFICACAO.md`": "`docs/dados/estatistica.json`",
              "CONTEXTO_ESTATISTICA_CLASSIFICACAO.md": "docs/dados/estatistica.json",
              "`docs/PLANO_PDF_ARTIGO_PAGES.md`": "`04_artigo/README.md`",
              "docs/PLANO_PDF_ARTIGO_PAGES.md": "04_artigo/README.md",
          }

          extensoes = {".md", ".txt", ".py", ".yml", ".yaml"}
          ignorar = {Path(".github/workflows/temporario_limpar_obsoletos_lote2.yml")}
          for caminho in Path(".").rglob("*"):
              if not caminho.is_file() or caminho.suffix.lower() not in extensoes:
                  continue
              if ".git" in caminho.parts or caminho in ignorar:
                  continue
              try:
                  texto = caminho.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              novo = texto
              for antigo, atual in substituicoes.items():
                  novo = novo.replace(antigo, atual)
              novo = novo.replace("`CONTEXTO.md`, `CONTEXTO.md`", "`CONTEXTO.md`")
              novo = novo.replace("CONTEXTO.md, CONTEXTO.md", "CONTEXTO.md")
              if novo != texto:
                  caminho.write_text(novo, encoding="utf-8")

          Path(".github/workflows/temporario_limpar_obsoletos_lote2.yml").unlink()
          PY

      - name: Validar ausência de referências quebradas
        run: |
          if grep -RIn --exclude-dir=.git \
            -e 'RELATORIO_ESTADO_ATUAL.md' \
            -e 'PLANO_CALIBRACAO.md' \
            -e 'OBJETIVO_FINAL_MODELO_IA.txt' \
            -e 'apps_script/Code.gs' \
            -e 'GUIA_TECNICO.md' \
            -e 'FALTA_FAZER.md' \
            -e 'CONTEXTO_ESTATISTICA_CLASSIFICACAO.md' \
            -e 'PLANO_PDF_ARTIGO_PAGES.md' .; then
            echo "Ainda existem referências aos arquivos removidos." >&2
            exit 1
          fi

      - name: Commitar e abrir Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git diff --cached --quiet && { echo "sem mudanças"; exit 0; }
          git commit -m "docs: remove documentos obsoletos do segundo lote"
          git push --set-upstream origin docs/remover-obsoletos-lote2 --force-with-lease
          gh pr create \
            --base main \
            --head docs/remover-obsoletos-lote2 \
            --title "docs: remove documentos obsoletos do segundo lote" \
            --body "Remove cinco arquivos autorizados como obsoletos e corrige referências internas aos documentos excluídos neste e no lote anterior. A rotina temporária também se remove no mesmo PR. Não altera dados, planilha, artigo nem código de processamento." 
